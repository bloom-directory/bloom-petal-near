name: Release Petal

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    # Pin both the workflow and its CLI tooling to the same immutable commit.
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@864a80b407387871bae06aabe77b91865e55f7bc
    with:
      petal-name: near-intents
      petal-tooling-ref: "864a80b407387871bae06aabe77b91865e55f7bc"
      build-command: scripts/build.sh
      expected-route-count: 24
    secrets:
      compile-time-secret: ${{ secrets.NEAR_INTENTS_PARTNER_JWT }}
