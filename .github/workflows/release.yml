name: Release Petal

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    # Pin both the workflow and its CLI tooling to the same immutable commit.
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@1b6ede4b8d8e88026c019651018deb7c1973ecfe
    with:
      petal-name: near-intents
      petal-tooling-ref: "1b6ede4b8d8e88026c019651018deb7c1973ecfe"
      build-command: scripts/build.sh
      expected-route-count: 24
    secrets:
      compile-time-secret: ${{ secrets.NEAR_INTENTS_PARTNER_JWT }}
