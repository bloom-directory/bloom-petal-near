name: Release Petal

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    # Pin both the workflow and its CLI tooling to the same immutable commit.
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@4fefa736df67fa1ee51aeaa0c749d2f11414257d
    with:
      petal-name: near-intents
      petal-tooling-ref: "4fefa736df67fa1ee51aeaa0c749d2f11414257d"
      build-command: scripts/build.sh
      expected-route-count: 25
    secrets:
      compile-time-secret: ${{ secrets.NEAR_INTENTS_PARTNER_JWT }}
