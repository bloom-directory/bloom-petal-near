name: Release Petal

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    # Pin both the workflow and its CLI tooling to the same immutable commit.
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@39bc8476ff055922f52b71a4953ed70004e9c5d3
    with:
      petal-name: near-intents
      petal-tooling-ref: "39bc8476ff055922f52b71a4953ed70004e9c5d3"
      build-command: scripts/build.sh
      expected-route-count: 24
    secrets:
      compile-time-secret: ${{ secrets.NEAR_INTENTS_PARTNER_JWT }}
