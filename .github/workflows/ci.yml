name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: route
      - name: Test route crate
        run: |
          scripts/check-route-architecture.sh
          cargo fmt --manifest-path route/Cargo.toml -- --check
          cargo test --manifest-path route/Cargo.toml --locked
          cargo clippy --manifest-path route/Cargo.toml --locked --all-targets -- -D warnings
      - name: Install component tools
        run: cargo install wasm-tools --version 1.249.0 --locked
      - name: Install canonical Petal toolchain
        run: cargo install --git https://github.com/bloom-directory/petal --rev 2beed2ff344ce2b0c112e07096027e1ae0404007 --locked bloom-petal-cli
      - name: Build and inspect all routes
        shell: bash
        run: |
          set -euo pipefail
          scripts/build.sh
          petal check --root .
          # Read the routes into an array first: an empty find leaves zero
          # entries and fails the count below rather than silently checking
          # nothing.
          mapfile -t routes < <(find petal/near-intents -name '*.wasm')
          test "${#routes[@]}" = 27
          # Dump each component's WIT with a plain loop. A pipeline or a
          # process substitution would hide a `wasm-tools` failure, leaving
          # grep with empty input — and `! grep` on empty input succeeds, so
          # the guard would pass while guarding nothing.
          wit="${RUNNER_TEMP:-/tmp}/routes.wit"
          : > "$wit"
          for route in "${routes[@]}"; do
            wasm-tools component wit "$route" >> "$wit"
          done
          test -s "$wit"
          ! grep -n 'bloom:sign/signing@' "$wit"
